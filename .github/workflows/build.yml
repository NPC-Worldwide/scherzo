name: Build and Release
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pyinstaller
      - run: npm ci --legacy-peer-deps
      - name: Build PyInstaller backend (macOS)
        run: |
          pyinstaller --onefile --clean --distpath pyinstaller_dist --noupx \
            --hidden-import=npcpy --hidden-import=npcpy.serve \
            --hidden-import=flask --hidden-import=flask_cors --hidden-import=flask_sse \
            --hidden-import=pillow --hidden-import=pydantic --hidden-import=yaml \
            --exclude-module=scipy --exclude-module=tensorflow --exclude-module=torch \
            --exclude-module=sklearn --exclude-module=notebook --exclude-module=ipython \
            --exclude-module=jupyter --exclude-module=nbconvert --exclude-module=cv2 \
            --exclude-module=PIL.ImageTk --exclude-module=PIL.ImageQt --exclude-module=docx \
            --exclude-module=pptx --exclude-module=cuda --exclude-module=cudnn \
            --exclude-module=cudart --exclude-module=cublas --exclude-module=cupy \
            --exclude-module=logfire --exclude-module=numba.cuda --exclude-module=torch.cuda \
            --exclude-module=nltk --exclude-module=tensorflow.python.framework.cuda_util \
            --collect-data=npcpy scherzo_serve.py
          mkdir -p resources/backend
          cp pyinstaller_dist/scherzo_serve resources/backend/scherzo_serve
          chmod +x resources/backend/scherzo_serve
      - name: Test PyInstaller backend imports (macOS)
        run: |
          ./resources/backend/scherzo_serve --test-import 2>&1 | head -20 || true
      - run: npm run build:renderer
      - run: npm run build:electron
      - run: npm run build:preload
      - run: npx electron-builder --mac --publish=never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
      - uses: google-github-actions/auth@v2
        with: { credentials_json: ${{ secrets.GCS_SA_KEY }} }
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gsutil cp release/*.dmg gs://scherzo-releases/macos/ || true
          gsutil cp release/*.zip gs://scherzo-releases/macos/ || true

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pyinstaller
      - run: npm ci --legacy-peer-deps
      - name: Build PyInstaller backend (Windows)
        run: |
          python -m PyInstaller --onefile --clean --distpath pyinstaller_dist --noupx --hidden-import=npcpy --hidden-import=npcpy.serve --hidden-import=flask --hidden-import=flask_cors --hidden-import=flask_sse --hidden-import=pillow --hidden-import=pydantic --hidden-import=yaml --collect-data=npcpy scherzo_serve.py
          mkdir -p resources/backend
          copy pyinstaller_dist\scherzo_serve.exe resources\backend\scherzo_serve.exe
      - name: Test PyInstaller backend imports (Windows)
        run: |
          resources\backend\scherzo_serve.exe --test-import 2>&1 | head -20 || true
      - run: npm run build:renderer
      - run: npm run build:electron
      - run: npm run build:preload
      - run: npx electron-builder --win --publish=never
      - uses: google-github-actions/auth@v2
        with: { credentials_json: ${{ secrets.GCS_SA_KEY }} }
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gsutil cp release/*.exe gs://scherzo-releases/windows/ || true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pyinstaller
      - run: npm ci --legacy-peer-deps
      - name: Build PyInstaller backend (Linux)
        run: |
          pyinstaller --onefile --clean --distpath pyinstaller_dist --noupx \
            --hidden-import=npcpy --hidden-import=npcpy.serve \
            --hidden-import=flask --hidden-import=flask_cors --hidden-import=flask_sse \
            --hidden-import=pillow --hidden-import=pydantic --hidden-import=yaml \
            --exclude-module=scipy --exclude-module=tensorflow --exclude-module=torch \
            --exclude-module=sklearn --exclude-module=notebook --exclude-module=ipython \
            --exclude-module=jupyter --exclude-module=nbconvert --exclude-module=cv2 \
            --exclude-module=PIL.ImageTk --exclude-module=PIL.ImageQt --exclude-module=docx \
            --exclude-module=pptx --exclude-module=cuda --exclude-module=cudnn \
            --exclude-module=cudart --exclude-module=cublas --exclude-module=cupy \
            --exclude-module=logfire --exclude-module=numba.cuda --exclude-module=torch.cuda \
            --exclude-module=nltk --exclude-module=tensorflow.python.framework.cuda_util \
            --collect-data=npcpy scherzo_serve.py
          mkdir -p resources/backend
          cp pyinstaller_dist/scherzo_serve resources/backend/scherzo_serve
          chmod +x resources/backend/scherzo_serve
      - name: Test PyInstaller backend imports (Linux)
        run: |
          ./resources/backend/scherzo_serve --test-import 2>&1 | head -20 || true
      - run: npm run build:renderer
      - run: npm run build:electron
      - run: npm run build:preload
      - run: npx electron-builder --linux --publish=never
      - uses: google-github-actions/auth@v2
        with: { credentials_json: ${{ secrets.GCS_SA_KEY }} }
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gsutil cp release/*.deb gs://scherzo-releases/linux/ || true
          gsutil cp release/*.AppImage gs://scherzo-releases/linux/ || true
